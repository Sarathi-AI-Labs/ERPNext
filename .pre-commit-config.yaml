exclude: 'ERPNEXT_MAIN|node_modules|\.git|scratch'
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*json$|.*txt$|.*csv|.*md"
      - id: check-yaml
        args: [--unsafe]
      - id: no-commit-to-branch
        args: ['--branch', 'develop', '--branch', 'main']
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
        exclude: ^\.vscode/extensions\.json$
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss, css]
        exclude: |
            (?x)^(
                .*/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                .*/templates/includes/.*|
                scratch/.*
            )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        exclude: |
            (?x)^(
                .*/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                .*/templates/pages/order.js|
                .*/templates/includes/.*|
                scratch/.*
            )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]
      - id: ruff
        name: "Run ruff linter"
        args: ["--fix", "--ignore=E731,UP035,RUF012,RUF013,UP038,RUF002,RUF005,B007"]
      - id: ruff-format
        name: "Run ruff formatter"

  - repo: local
    hooks:
      - id: postgres-compat
        name: "PostgreSQL compatibility (static check)"
        description: "Flags MySQL-only SQL that breaks on Postgres; the label-gated PG test job is the backstop for semantic divergences."
        entry: python .github/helper/postgres_compat.py
        language: system
        files: \.py$
        exclude: |
            (?x)^(
                .*/patches/.*|
                scratch/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
