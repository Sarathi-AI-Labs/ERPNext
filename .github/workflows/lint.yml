name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install -U pre-commit

      - name: Lint sarathi_visibility
        run: |
          mapfile -t FILES < <(git ls-files -- 'sarathi_visibility/**')

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No tracked files found in sarathi_visibility/"
            exit 0
          fi

          echo "Found ${#FILES[@]} files in sarathi_visibility/ to lint:"
          printf ' - %s\n' "${FILES[@]}"

          pre-commit run --color=always --files "${FILES[@]}"
