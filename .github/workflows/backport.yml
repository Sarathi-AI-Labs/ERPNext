name: Backport
on:
  pull_request_target:
    types:
      - closed
      - labeled

permissions:
  contents: write
  pull-requests: write

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.pull_request.merged == true && (secrets.RELEASE_TOKEN != '' || secrets.GITHUB_TOKEN != '') }}
    steps:
      - name: Checkout Actions
        uses: actions/checkout@v6
        with:
          repository: "frappe/backport"
          path: ./actions
          ref: develop
      - name: Install Actions
        run: npm install --production --prefix ./actions
      - name: Run backport
        continue-on-error: true
        uses: ./actions/backport
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          labelsToAdd: "backport"
          title: "{{originalTitle}}"
