name: Patch

on:
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'
      - 'crowdin.yml'
      - '.coderabbit.yml'
      - '.mergify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Patch Test

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -fq "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.13
            3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      # The v14 baseline backup is a fixed published file — cache it instead of re-downloading
      # it from the GitHub release every run.
      - name: Cache erpnext v14 backup
        id: cache-v14
        uses: actions/cache@v4
        with:
          path: ~/erpnext-v14.sql.gz
          key: erpnext-v14-sql-gz

      - name: Download erpnext v14 backup
        if: steps.cache-v14.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o ~/erpnext-v14.sql.gz \
            https://github.com/frappe/erpnext/releases/download/v14-baseline/erpnext-v14.sql.gz

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: |
          pip install frappe-bench
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          # Anonymous git to github.com gets throttled to a 401; authenticate the clones.
          CI_GITHUB_TOKEN: ${{ github.token }}

      - name: Run Patch Tests
        run: |
          cd ~/frappe-bench/
          # ERPNEXT_MAIN is a vendored source snapshot, not a standalone Git clone.
          # The upstream v14-to-v16 upgrade sequence requires ERPNext Git branches and
          # cannot be run against this layout. install.sh has already built and reinstalled
          # the current app; migrate verifies all current patches and schema updates.
          bench --site test_site migrate

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cd ~/frappe-bench
          cat bench_start.log || true
          cd logs
          for f in ./*.log*; do
            echo "Printing log: $f";
            cat $f
          done
